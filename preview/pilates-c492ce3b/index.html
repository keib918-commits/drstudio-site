const branch=L=>`<section class="low"><div class="wrap">${ctr(L.br.k,L.br.h,L.br.p)}<div class="pathwrap"><svg class="pathsvg rv" viewBox="0 0 1136 70" preserveAspectRatio="none" aria-hidden="true"><path d="M60 50C260 -10 340 80 568 36S900 -6 1076 42"/><circle cx="60" cy="50" r="6"/><circle cx="568" cy="36" r="6"/><circle cx="1076" cy="42" r="6"/></svg><div class="h3c">${L.br.s.map((s,i)=>`<article class="card w rv" style="transition-delay:${i*.14}s"><div class="pill">${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></article>`).join("")}</div></div><div class="paths">${L.br.paths.map((x,i)=>`<article class="card rv ${i?"sub":"main"}" style="transition-delay:${i*.12}s"><div class="lab">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join("")}</div><h3 class="rv" style="font-size:24px;margin:44px 0 18px">${L.br.ch}</h3><div class="h4c">${L.br.cs.map((c,i)=>`<article class="mini rv" style="transition-delay:${i*.09}s"><h3>${c[0]}</h3><p>${c[1]}</p></article>`).join("")}</div><p class="note rv">${P(L.br.n)}</p></div></section>`;

<section class="low"><div class="wrap">${ctr(RL[lang].k,RL[lang].h,RL[lang].p)}<div class="res">${rc(RES.slice(0,3))}</div><div class="resmore rv"><a class="btn ghost" href="#research">${RL[lang].more}</a></div><p class="note">${RL[lang].n}</p></div></section>

<section class="mid"><div class="wrap">${verify(L)}</div></section>`,

centers:L=>head(L.centers)+`<section><div class="wrap">${centers(L)}</div></section>`,
verify:L=>head(L.verify)+`<section class="mid"><div class="wrap">${verify(L)}</div></section>`,
notice:L=>head(L.notice)+`<section><div class="wrap">${list(L.nt)}</div></section>`,
apply:L=>{const a=L.apply,f=a.f;return head(a)+`<section><div class="wrap" style="max-width:680px"><form class="form rv" onsubmit="event.preventDefault();alert('${a.done}')"><label>${f[0]}<input required></label><label>${f[1]}<input required></label><label>${f[2]}<input type="email"></label><label>${f[3]}<select>${a.o.map(o=>`<option>${o}</option>`).join("")}</select></label><label>${f[4]}<select>${a.s.map(o=>`<option>${o}</option>`).join("")}</select></label><label>${f[5]}<textarea rows="4"></textarea></label><label style="grid-template-columns:auto 1fr;align-items:start;font-weight:400"><input type="checkbox" required style="width:auto;margin-top:6px"><span>${P(a.consent)}</span></label><button class="btn">${a.b}</button></form></div></section>`}};
const PM="https://pubmed.ncbi.nlm.nih.gov/";
const RES=[
{k:"paper",d:"2026.10",s:"International Urogynecology Journal",u:PM+"42142163/",ko:["온라인 필라테스가 폐경 후 여성에게 미친 영향","무작위 대조 연구입니다. 폐경 증상, 전반적 삶의 질, 우울과 불안은 개선됐고, 비뇨생식기 증상과 성 관련 삶의 질에는 유의한 변화가 없었습니다."],ja:["オンラインピラティスが閉経後女性に与えた影響","ランダム化比較試験です。更年期症状、全般的QOL、抑うつと不安は改善し、泌尿生殖器症状と性に関するQOLに有意な変化はありませんでした。"]},
{k:"news",d:"2026.09",s:"Merrithew",u:"https://www.merrithew.com/events/202609_asia-symposium/symposium-attendees",ko:["STOTT PILATES 운영사 Merrithew의 아시아 심포지엄","Merrithew의 2026년 일정으로 9월 11~13일 상하이 심포지엄이 안내됐습니다."],ja:["STOTT PILATESを運営するMerrithewのアジアシンポジウム","Merrithewの2026年の日程として、9月11〜13日の上海シンポジウムが案内されました。"]},
{k:"paper",d:"2026.07",s:"BMC Geriatrics",u:PM+"42902197/",ko:["고령자의 균형과 보행, 유산소 운동과 필라테스 비교","두 운동 모두 보행 속도, 기능, 균형이 의미 있게 개선됐고, 동적 균형은 유산소 그룹이 더 크게 향상됐습니다."],ja:["高齢者のバランスと歩行：有酸素運動とピラティスの比較","どちらの運動でも歩行速度、機能、バランスに有意義な改善が見られ、動的バランスは有酸素群でより大きく向上しました。"]},
{k:"paper",d:"2026.07",s:"BMC Musculoskeletal Disorders",u:PM+"42437906/",ko:["만성 요통에서 필라테스의 비용 대비 효과","브라질 공공보건 기준의 경제성 평가입니다. 가정 운동과 비교해 통증, 장애, 삶의 질 측면에서 비용 효과적이라는 결과입니다."],ja:["慢性腰痛におけるピラティスの費用対効果","ブラジルの公的保健基準による経済評価です。自宅運動と比べ、痛み、障害、QOLの面で費用対効果が高いとの結果です。"]},
{k:"paper",d:"2026.07",s:"Journal of Hypertension",u:PM+"42201655/",ko:["고혈압 여성의 13주 필라테스와 활동 혈압","13주 프로그램 뒤 활동 혈압 감소와 자율신경 반사 반응 향상이 관찰됐습니다. 약물 치료의 보조 운동으로 실행 가능하다고 보고했습니다."],ja:["高血圧の女性における13週間のピラティスと自由行動下血圧","13週間のプログラム後、自由行動下血圧の低下と自律神経反射の向上が観察されました。薬物療法の補助運動として実施可能と報告されています。"]},
{k:"news",d:"2026.05",s:"Retail Insider",u:"https://retail-insider.com/retail-insider/2026/05/merrithew-opens-stott-pilates-flagship-at-yonge-and-bloor/",ko:["STOTT PILATES, 토론토 플래그십 개관","Merrithew가 토론토 Yonge·Bloor 지역에 STOTT PILATES 플래그십을 열었다고 보도됐습니다."],ja:["STOTT PILATES、トロントにフラッグシップを開設","MerrithewがトロントのYonge・Bloor地区にSTOTT PILATESのフラッグシップを開設したと報じられました。"]},
{k:"news",d:"2026",s:"Athletech News",u:"https://athletechnews.com/issa-launches-first-reformer-pilates-certification/",ko:["미국 필라테스 참여자 1,380만 명","2026년 SFIA 보고서 인용 수치로, 2025년 참여자는 2020년 990만 명에서 1,380만 명으로 늘었습니다. 리포머 자격 과정 신설 소식과 함께 전해졌습니다."],ja:["米国のピラティス参加者は1,380万人","2026年のSFIA報告書を引用した数値で、2025年の参加者は2020年の990万人から1,380万人に増えました。リフォーマー資格課程の新設とあわせて伝えられました。"]}];

const rc=a=>a.map((r,i)=>`<a class="rc rv" style="transition-delay:${(i%3)*.1}s" href="${r.u}" target="_blank" rel="noopener"><div class="m"><span class="t">${RL[lang][r.k]}</span><span>${r.d}</span></div><h3>${r[lang][0]}</h3><p>${r[lang][1]}</p><span class="s">${r.s} · ${RL[lang].open} ↗</span></a>`).join("");
window.fRes=(k,b)=>{document.querySelectorAll(".ftabs button").forEach(x=>x.classList.toggle("on",x==b));document.getElementById("resg").innerHTML=rc(k=="all"?RES:RES.filter(r=>r.k==k));reveal()};
function lightSpine(v){const t=document.querySelectorAll("#spine i"),c=Math.round(v*(t.length-1));t.forEach((e,i)=>{e.classList.toggle("on",i<c);e.classList.toggle("cur",i==c)})}
document.getElementById("spine").innerHTML=Array.from({length:24},(_,i)=>`<i style="width:${Math.round(12+11*Math.sin(i/23*Math.PI*2.1+.35)+6)}px"></i>`).join("");
let io;
function reveal(){if(io)io.disconnect();const E=document.querySelectorAll(".rv");if(!("IntersectionObserver" in window)){E.forEach(e=>e.classList.add("in"));return}io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08,rootMargin:"0px 0px -40px 0px"});E.forEach(e=>io.observe(e))}
function render(){const L=C[lang];document.documentElement.lang=lang;const r=(location.hash||"#home").slice(1),k=V[r]?r:"home";
document.getElementById("proto").textContent=L.proto;document.getElementById("logo").innerHTML=`${P(L.org)}<small>${L.corp}</small>`;
document.getElementById("nav").innerHTML=Object.entries(L.menu).map(([h,t])=>`<a href="#${h}" class="${h==k?"on":""}">${t}</a>`).join("");
document.getElementById("app").innerHTML=V[k](L);
document.getElementById("foot").innerHTML=`<div><h3>${L.corp} ${P(L.org)}</h3><p>${P(L.foot.addr)}</p><div class="footnav">${Object.entries(L.menu).map(([h,t])=>`<a href="#${h}">${t}</a>`).join("")}</div></div><p class="notice">${P(L.foot.n)}</p>`;
document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l==lang));document.getElementById("nav").classList.remove("open");scrollTo(0,0);reveal()}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("lang",lang)}catch(e){}render()});
document.getElementById("menu").onclick=()=>document.getElementById("nav").classList.toggle("open");
addEventListener("hashchange",render);
addEventListener("scroll",()=>{const h=document.documentElement,m=h.scrollHeight-innerHeight;lightSpine(m>0?scrollY/m:0);document.getElementById("hd").classList.toggle("sc",scrollY>20)},{passive:true});
/* flowing ribbon */
let mx=0,my=0;addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function ribbon(t){const c=document.getElementById("rib");if(c){const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2),W=r.width,H=r.height;if(c.width!=Math.round(W*d)||c.height!=Math.round(H*d)){c.width=Math.round(W*d);c.height=Math.round(H*d)}const g=c.getContext("2d");g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);const n=34,narrow=W<760,cx=W*(narrow?.82:.74)+mx*36,amp=(narrow?40:Math.min(120,W*.09));
for(let i=0;i<n;i++){const u=i/(n-1),off=(u-.5)*(narrow?90:230);g.beginPath();for(let y=-20;y<=H+20;y+=12){const v=y/H,x=cx+off*(.45+.55*Math.sin(v*Math.PI*1.2+t*.00028))+amp*Math.sin(v*Math.PI*2.1+t*.00042+u*1.15)+my*24*Math.cos(v*3);y==-20?g.moveTo(x,y):g.lineTo(x,y)}const a=.1+.36*Math.sin(u*Math.PI);g.strokeStyle=i%6==0?`rgba(44,36,31,${a+.12})`:`rgba(158,141,66,${a})`;g.lineWidth=i%6==0?1.3:.9;g.stroke()}}if(!still)requestAnimationFrame(ribbon)}
render();requestAnimationFrame(ribbon);
</script>
